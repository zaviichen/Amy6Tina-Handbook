# GitHub Pages — 构建静态站并发布到
# https://zaviichen.github.io/Amy6Tina-Handbook/
#
# 两条路径同时走：
# 1) 官方 actions/deploy-pages（Source = GitHub Actions 时自动启用站点）
# 2) 把构建产物推到 gh-pages 分支（Settings → Pages → Deploy from branch / gh-pages 可用）
# 仓库同时提交 docs/，也可选 Deploy from branch / main /docs

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          python3 tools/build_handbook.py
          python3 tools/test_build.py
          npm ci
          npx vite build
          touch docs/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          enable_jekyll: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
